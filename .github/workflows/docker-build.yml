name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker credentials
        id: check_credentials
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "⚠️  Docker Hub credentials not configured. Will build only."
          fi

      - name: Log in to Docker Hub
        if: steps.check_credentials.outputs.has_credentials == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.check_credentials.outputs.has_credentials == 'true' && format('{0}/email-forwarder', secrets.DOCKER_USERNAME) || 'email-forwarder' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ steps.check_credentials.outputs.has_credentials == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        run: |
          if [ "${{ steps.check_credentials.outputs.has_credentials }}" == "true" ]; then
            echo "✅ Docker image built and pushed successfully"
            echo "📦 Image: ${{ secrets.DOCKER_USERNAME }}/email-forwarder"
          else
            echo "✅ Docker image built successfully (local only)"
            echo "ℹ️  To push images, configure DOCKER_USERNAME and DOCKER_PASSWORD secrets"
            echo "   Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
          fi
