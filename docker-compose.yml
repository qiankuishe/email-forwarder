version: '3.8'

services:
  mail-gateway:
    build: .
    image: mail-gateway:latest
    container_name: mail-gateway
    restart: unless-stopped
    ports:
      # 必须映射到主机的 25 端口，否则外部无法投递邮件
      - "25:25"
      # HTTP 状态面板和注册接口
      - "8088:8088"
    volumes:
      # 挂载宿主机目录，持久化保存申请下来的 TLS 证书，防止重启频繁申请被拉黑
      - ./certs:/app/certs
